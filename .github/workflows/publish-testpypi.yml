name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to publish"
        required: true
        default: "feature/semantic-model-tools"
      run_integration_tests:
        description: "Run integration tests"
        required: false
        type: boolean
        default: false

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve commit
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    needs: resolve-ref
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    needs: [resolve-ref, tests]
    if: ${{ inputs.run_integration_tests }}
    timeout-minutes: 60
    environment: Integration
    env:
      FABRIC_INTEGRATION_TESTS: "1"
      FABRIC_TEST_WORKSPACE_NAME: ${{ secrets.FABRIC_TEST_WORKSPACE_NAME }}
      FABRIC_TEST_LAKEHOUSE_NAME: ${{ secrets.FABRIC_TEST_LAKEHOUSE_NAME }}
      FABRIC_TEST_LAKEHOUSE_SQL_DATABASE: ${{ secrets.FABRIC_TEST_LAKEHOUSE_SQL_DATABASE }}
      FABRIC_TEST_POSTGRES_CONNECTION_ID: ${{ secrets.FABRIC_TEST_POSTGRES_CONNECTION_ID }}
      FABRIC_TEST_POSTGRES_SOURCE_TYPE: ${{ secrets.FABRIC_TEST_POSTGRES_SOURCE_TYPE }}
      FABRIC_TEST_POSTGRES_SCHEMA: ${{ secrets.FABRIC_TEST_POSTGRES_SCHEMA }}
      FABRIC_TEST_POSTGRES_TABLE: ${{ secrets.FABRIC_TEST_POSTGRES_TABLE }}
      FABRIC_TEST_POSTGRES_DEST_TABLE_NAME: ${{ secrets.FABRIC_TEST_POSTGRES_DEST_TABLE_NAME }}
      FABRIC_TEST_DEST_CONNECTION_ID: ${{ secrets.FABRIC_TEST_DEST_CONNECTION_ID }}
      FABRIC_TEST_WAREHOUSE_NAME: ${{ secrets.FABRIC_TEST_WAREHOUSE_NAME }}
      FABRIC_TEST_SQLSERVER_CONNECTION_ID: ${{ secrets.FABRIC_TEST_SQLSERVER_CONNECTION_ID }}
      FABRIC_TEST_SQLSERVER_SOURCE_TYPE: ${{ secrets.FABRIC_TEST_SQLSERVER_SOURCE_TYPE }}
      FABRIC_TEST_SQLSERVER_SCHEMA: ${{ secrets.FABRIC_TEST_SQLSERVER_SCHEMA }}
      FABRIC_TEST_SQLSERVER_TABLE: ${{ secrets.FABRIC_TEST_SQLSERVER_TABLE }}
      FABRIC_TEST_SQLSERVER_DEST_TABLE_NAME: ${{ secrets.FABRIC_TEST_SQLSERVER_DEST_TABLE_NAME }}
      FABRIC_TEST_DATAFLOW_NAME: ${{ secrets.FABRIC_TEST_DATAFLOW_NAME }}
      FABRIC_TEST_SEMANTIC_MODEL_TABLE: ${{ secrets.FABRIC_TEST_SEMANTIC_MODEL_TABLE }}
      FABRIC_TEST_SEMANTIC_MODEL_COLUMNS: ${{ secrets.FABRIC_TEST_SEMANTIC_MODEL_COLUMNS }}
      FABRIC_TEST_SEMANTIC_MODEL_TABLE_2: ${{ secrets.FABRIC_TEST_SEMANTIC_MODEL_TABLE_2 }}
      FABRIC_TEST_SEMANTIC_MODEL_COLUMNS_2: ${{ secrets.FABRIC_TEST_SEMANTIC_MODEL_COLUMNS_2 }}
      FABRIC_TEST_SEMANTIC_MODEL_SCHEMA: ${{ secrets.FABRIC_TEST_SEMANTIC_MODEL_SCHEMA }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ODBC driver
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev --extra sql --extra telemetry

      - name: Run integration tests
        run: |
          uv run pytest -m integration

  packaged-protocol:
    runs-on: ubuntu-latest
    needs: [resolve-ref, tests]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build wheel
        run: |
          uv build --wheel --out-dir dist
          echo "FABRIC_PACKAGED_WHEEL=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)" >> "$GITHUB_ENV"

      - name: Test packaged MCP protocol
        run: |
          uv run pytest tests/fabric/integration/test_packaged_stdio_integration.py

      - name: Upload tested wheel
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [resolve-ref, tests, integration, packaged-protocol]
    if: >-
      ${{
        always() &&
        needs.tests.result == 'success' &&
        needs.packaged-protocol.result == 'success' &&
        (needs.integration.result == 'success' || needs.integration.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download tested wheel
        uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_KEY }}
          repository-url: https://test.pypi.org/legacy/
